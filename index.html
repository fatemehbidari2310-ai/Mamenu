<style>

.lx{font-family:'Playfair Display',Georgia,'Times New Roman',serif;letter-spacing:.3px}:root{--pnr:251,246,243;--sdr:154,134,232;--h1r:220,207,250;--h2r:194,178,242}
body{background:radial-gradient(circle at 12% 8%,var(--pk3),transparent 42%),radial-gradient(circle at 92% 28%,var(--pk2),transparent 48%),radial-gradient(circle at 25% 96%,var(--pk3),transparent 44%),linear-gradient(160deg,var(--bg),var(--bg2)) fixed}

.side{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.04)),rgba(var(--sdr),.7);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.45)}

.sheet{background:rgba(var(--pnr),.8);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px)}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),ymd=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const back=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
const DEF={cats:[
{id:'t',n:'طعم و عطر',e:'🍰',subs:['شیرینی‌پزی','آشپزی','پخت نان']},
{id:'b',n:'وقت رسیدگیه…',e:'💆‍♀️',subs:['Fafa beauty','ماسک مو و صورت','اسپا']},
{id:'m',n:'تکون بده',e:'💃',subs:['رقص','باشگاه','شنا','پیاده‌روی']},
{id:'c',n:'the creative nook',e:'🎨',subs:['نقاشی','گیتار','خیاطی']},
{id:'g',n:'touch of green',e:'🌿',subs:['گل و گیاه']},
{id:'r',n:'beyond reality',e:'📖',subs:['رمان','داستان','مطالعه‌ی تاریخی']},
{id:'j',n:'ارتقای شغلی',e:'💊',subs:['فارمسی','صنعت','دوره و وبینار','مهارت‌آموزی']},
{id:'l',n:'bilingual life',e:'🌍',subs:['انگلیسی','دولینگو','یوتیوب','کتاب']},
{id:'o',n:'out and about',e:'☕',subs:['طبیعت','کافه','غذای جدید','پیاده‌روی دلی']},
{id:'v',n:'recharge',e:'🚗',subs:['سفر']},
{id:'p',n:'پاداش بی‌بهانه',e:'🎁',subs:['هدیه به خودم','محبت به خودم','محبت به دیگران']}],
entries:[],days:{},goals:[{id:'g1',n:'تسلط به زبان',t:3000,cs:['l']}],notes:[],set:{g:'f',name:'',ac:'',bk:'',title:'منوی من 🍋',xb:'چیکا کردی با خودت وای... 💕',ph:'امروز چه کارایی کردی؟ خودمونی بگو…',mis:''},quotes:['راه حل خودتی!','اولویت همیشه با حال خوبه 🍋']};
const MO=['😍','🥰','😊','😌','😐','😔','😣'],PAL=['#e8799f','#f2a6c0','#c58be0','#8fb8f0','#7ed3b8','#f5c26b','#f59e7b','#b0a1f5','#ee8fb8','#9ad07a','#e58a8a','#78c6d9'];
let S=JSON.parse(JSON.stringify(DEF)),ref=null,ed=null,eg=null,en=null,ec=null,dc=null,tab='home',date=ymd(),rng='day',from=back(29),to=ymd(),ai='',curF='😊',qi=0,R={};
const cat=id=>S.cats.find(c=>c.id==id)||{id,n:'؟',e:'✨',subs:[]};
const tot=l=>l.reduce((a,e)=>a+(+e.x||0),0);
function save(){try{localStorage.setItem('menu',JSON.stringify(S))}catch(e){}if(ref)ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{});render()}
function init0(){try{const l=localStorage.getItem('menu');if(l)S=Object.assign(S,JSON.parse(l))}catch(e){}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}try{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}}
function span(){if(rng=='day')return[date,date];if(rng=='7')return[back(6),ymd()];if(rng=='30')return[back(29),ymd()];if(rng=='all')return['0000','9999'];return[from,to]}
function today(){const l=S.entries.filter(e=>e.d==date),c0=S.cats[0]?S.cats[0].id:'',E=S.entries.find(e=>e.id==ed)||{};
return`<div class="c">${dpick(date,'sd')}<div class="m" style="margin-top:6px">مود کلی این روز:</div><div class="chips">${MO.map(e=>`<button class="mo ${S.days[date]==e?'on':''}" onclick="S.days['${date}']='${e}';save()">${e}</button>`).join('')}</div></div>
<div class="c"><h3>روایت شبانه 🌙</h3><textarea id="nar" placeholder="${esc(S.set.ph)}">${esc((S.nar||{})[date]||'')}</textarea><button class="p" id="xb" onclick="svN()">${esc(S.set.xb)}</button></div>
<div class="c">${E.id?'<h3>ویرایش ✏️</h3>':''}<input id="ft" list="dl" value="${esc(E.t||'')}" oninput="mc()" placeholder="چیکا کردی"><datalist id="dl">${S.cats.flatMap(c=>c.subs.map(s=>`<option value="${esc(s)}" label="${esc(c.n)}">`)).join('')}</datalist><select id="fc" onchange="pc(this.value)">${ccH()}</select>
<div class="row"><input id="fm" type="number" inputmode="numeric" value="${E.m||''}" placeholder="چند دقیقه؟"><div class="m" style="text-align:center">امتیاز: <b id="xv">${E.x||60}</b></div></div><input id="fx" type="range" min="20" max="150" step="5" value="${E.x||60}" oninput="$('#xv').textContent=this.value"><div class="m">عمق کار + حسِ خوبی که داد + تداوم</div>
<div class="chips">${MO.map(e=>`<button class="mo ${curF==e?'on':''}" data-e="${e}" onclick="curF='${e}';document.querySelectorAll('.mo[data-e]').forEach(b=>b.classList.toggle('on',b.dataset.e=='${e}'))">${e}</button>`).join('')}</div><button class="p" onclick="addE()">${E.id?'ذخیره‌ی تغییر':'ثبتش کن'} 🌷</button>${E.id?'<button class="p" style="background:var(--pk2);color:var(--ink)" onclick="ed=null;render()">بیخیال</button>':''}</div>
<div class="c"><h3>ثبت‌های ${fa(date)} · ${tot(l)} XP</h3>${l.length?l.map(e=>`<div class="it"><span>${e.f||''} ${cat(e.c).e} ${esc(e.t)}<br><span class="m">${e.m?e.m+' دقیقه · ':''}${esc(cat(e.c).n)}</span></span><span>+${e.x} <button onclick="ee('${e.id}')" style="border:0;background:none">✏️</button><button onclick="S.entries=S.entries.filter(z=>z.id!='${e.id}');save()" style="border:0;background:none">✕</button></span></div>`).join(''):'<div class="m">هنوز چیزی ثبت نشده؛ هر وقت دلت خواست 🌸</div>'}</div>`}
function subs(){$('#dl').innerHTML=cat($('#fc').value).subs.map(s=>`<option value="${esc(s)}">`).join('')}
const nz=x=>String(x).toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\s]+/g,'');
let FC='',FS='',FA=false;
function mt(q){q=nz(q);if(q.length<2)return null;for(const c of S.cats)for(const s of c.subs)if(nz(s)==q)return[c,s];for(const c of S.cats)for(const s of c.subs){const z=nz(s);if(z.length>=2&&(q.includes(z)||z.includes(q)))return[c,s]}for(const c of S.cats){const z=nz(c.n);if(z.length>=2&&(q==z||q.includes(z)))return[c,'']}return null}
function mc(){const q=$('#ft').value,m=mt(q);if(m){FC=m[0].id;FS=m[1];FA=true}else if(FA){FC='';FS='';FA=false}$('#fc').innerHTML=ccH();$('#fc').classList.toggle('need',!!q.trim()&&!FC)}
function pc(id){FC=id;FS='';FA=false;$('#fc').classList.toggle('need',!!$('#ft').value.trim()&&!FC)}
function ps(s){FS=s;$('#ft').value=s;$('#cc').innerHTML=ccH(s)}
function ccH(){return'<option value="" '+(FC?'':'selected')+'>دسته…</option>'+S.cats.map(c=>`<option value="${c.id}" ${FC==c.id?'selected':''}>${c.e} ${esc(c.n)}</option>`).join('')}
function ee(id){const e=S.entries.find(z=>z.id==id);ed=id;curF=e.f||'😊';FC=e.c;FS=e.s||'';FA=false;render();scrollTo(0,0)}
function addE(){const t=$('#ft').value.trim();if(!t)return;if(!FC){const z=$('#fc');z.classList.add('need');z.focus();return}const C=cat(FC);if(!mt(t)&&!C.subs.some(x=>nz(x)==nz(t))&&t.length<=25){C.subs.push(t);FS=t}const o={c:FC,t,s:FS||'',m:+$('#fm').value||0,f:curF,x:+$('#fx').value},E=S.entries.find(e=>e.id==ed);if(E)Object.assign(E,o);else S.entries.push({id:uid(),d:date,...o});ed=null;FC='';FS='';FA=false;save()}
function svN(){S.nar=S.nar||{};S.nar[date]=$('#nar').value;save()}
function report(){const[a,b]=span(),l=S.entries.filter(e=>e.d>=a&&e.d<=b),by=S.cats.map((c,i)=>({c,i,k:c.col||PAL[i%12],x:tot(l.filter(e=>e.c==c.id)),m:l.filter(e=>e.c==c.id).reduce((s,e)=>s+(+e.m||0),0)})),T=tot(l),act=by.filter(z=>z.x>0).sort((p,q)=>q.x-p.x),C=2*Math.PI*40;let acc=0;
const pie=act.map(z=>{const len=z.x/T*C,s=`<circle r="40" cx="50" cy="50" fill="none" stroke="${z.k}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 50 50)"/>`;acc+=len;return s}).join('');
const mx=Math.max(1,...by.map(z=>z.x)),bw=300/by.length,bars=by.map((z,k)=>{const h=z.x/mx*100;return`<rect x="${k*bw+4}" y="${120-h}" width="${bw-8}" height="${h}" rx="9" fill="${z.k}"/><text x="${k*bw+bw/2}" y="${114-h}" font-size="9" text-anchor="middle" fill="currentColor">${z.x||''}</text><text x="${k*bw+bw/2}" y="138" font-size="13" text-anchor="middle">${z.c.e}</text>`}).join('');
const mood={};l.forEach(e=>{if(e.f)mood[e.f]=(mood[e.f]||0)+1});Object.entries(S.days).forEach(([d,e])=>{if(d>=a&&d<=b)mood[e]=(mood[e]||0)+1});
const strong=act.slice(0,2).map(z=>z.c.e+' '+z.c.n),calm=rng=='day'?[]:by.filter(z=>!z.x).map(z=>z.c.e+' '+z.c.n);
const goals=S.goals.map(g=>{const x=tot(S.entries.filter(e=>g.cs.includes(e.c)));return{g,x,p:Math.min(100,Math.round(x/g.t*100))}});
R.txt=`گزارش ${rng=='day'?fa(a):rng=='all'?'از اول تا الان':fa(a)+' تا '+fa(b)}\nمجموع: ${T} XP در ${l.length} فعالیت\n`+by.filter(z=>z.x).map(z=>`${z.c.n}: ${z.x} XP، ${z.m} دقیقه`).join('\n')+`\nمودها: ${Object.entries(mood).map(([e,n])=>e+'×'+n).join(' ')}\nهدف‌ها: `+goals.map(o=>`${o.g.n} ${o.p}%`).join('، ');
const chip=(k,t)=>`<button class="${rng==k?'on':''}" onclick="rng='${k}';render()">${t}</button>`;
return`<div class="c"><div class="chips">${chip('day','یک روز')}${chip('7','۷ روز اخیر')}${chip('30','ماه گذشته')}${chip('all','از اول تا الان')}${chip('x','بازه‌ی دلخواه')}</div>
${rng=='day'?`${dpick(date,'sd')}`:rng=='x'?`<div class="m">از</div>${dpick(from,'sfrom')}<div class="m">تا</div>${dpick(to,'sto')}`:''}</div>
<div class="c"><h3>${T} XP · ${l.length} فعالیت</h3>${T?`<svg viewBox="0 0 100 100" style="width:170px;display:block;margin:auto"><circle r="40" cx="50" cy="50" fill="none" stroke="var(--pk2)" stroke-width="18"/>${pie}<text x="50" y="54" font-size="13" text-anchor="middle" fill="currentColor">${T}</text></svg><div class="chips">${act.map(z=>`<span class="m"><span style="color:${z.k}">●</span> ${z.c.e} ${Math.round(z.x/T*100)}%</span>`).join('')}</div>
<svg viewBox="0 0 300 145" style="width:100%;margin-top:8px">${bars}</svg>${act.map(z=>`<div class="it"><span>${z.c.e} ${esc(z.c.n)}</span><span class="m">${z.m} دقیقه · ${z.x} XP</span></div>`).join('')}`:'<div class="m">برای این بازه چیزی ثبت نشده 🌸</div>'}</div>
<div class="c"><h3>حال‌وهوا</h3><div style="font-size:20px">${Object.entries(mood).map(([e,n])=>e+'<span class="m">×'+n+'</span> ').join('')||'<span class="m">—</span>'}</div></div>
<div class="c"><h3>داشبورد</h3>${strong.length?`<div>💪 پررنگ‌ترین: ${esc(strong.join('، '))}</div>`:''}${calm.length&&T?`<div class="m" style="margin-top:6px">🌱 این‌ها منتظرِ یه نوازشِ کوچیکن (بدون هیچ اجباری): ${esc(calm.join('، '))}</div>`:''}</div>
<div class="c"><h3>هدف‌ها 🎯</h3>${goals.map(o=>`<div style="margin:8px 0"><div class="row sp"><span>${esc(o.g.n)}</span><span class="m" style="text-align:left">${o.p}% · ${o.x}/${o.g.t}</span></div><div class="bar"><i style="width:${o.p}%"></i></div></div>`).join('')||'<div class="m">هنوز هدفی نذاشتی</div>'}</div>

function av(g,z){return`<img src="${AV[g]||AV.f}" width="${z}" height="${z}" style="width:${z}px;height:${z}px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 6px 14px var(--sh);flex:none;display:block">`}
const plant='<svg viewBox="0 0 60 80" width="50"><path d="M30 52C22 42 18 30 24 20c8 6 10 20 6 32zM30 52C38 44 46 34 42 22c-9 4-14 18-12 30zM30 52C30 40 30 28 30 14c6 8 6 24 0 38z" fill="#7fbf8f"/><path d="M14 52h32l-4 24H18z" fill="#e8c9a0"/></svg>',star='<svg viewBox="0 0 60 60" width="48"><path d="M30 4l7 17 18 2-14 12 5 18-16-10-16 10 5-18L5 23l18-2z" fill="#ffd45c" stroke="#f3b93c" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="30" r="2" fill="#6a4a1e"/><circle cx="36" cy="30" r="2" fill="#6a4a1e"/><path d="M26 36q4 3 8 0" stroke="#6a4a1e" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
function streak(){const d=new Set(S.entries.map(e=>e.d));let n=0,i=d.has(ymd())?0:1;while(d.has(back(i))){n++;i++}return n}
function wk(){const WD='Sun Mon Tue Wed Thu Fri Sat'.split(' '),ds=[6,5,4,3,2,1,0].map(i=>{const d=new Date();d.setDate(d.getDate()-i);return[ymd(d),WD[d.getDay()]]}),v=ds.map(z=>tot(S.entries.filter(e=>e.d==z[0]))),mx=Math.max(50,...v);return`<svg viewBox="0 0 150 105" style="width:100%">${ds.map((z,i)=>{const h=v[i]/mx*72,x=(6-i)*21+3;return`<rect x="${x}" y="${86-h}" width="15" height="${h||3}" rx="6" fill="${PAL[i%12]}"/>${h>10?`<rect x="${x+3}" y="${89-h}" width="2.5" height="${h-8}" rx="1.2" fill="#fff" opacity=".4"/>`:''}<text x="${x+7.5}" y="101" font-size="7" text-anchor="middle" fill="var(--mute)">${z[1]}</text>`}).join('')}</svg>`}
function dn(){const a=dr=='day'?ymd():dr=='7'?back(6):dr=='30'?back(29):'0000',l=S.entries.filter(e=>e.d>=a),by=S.cats.map((c,i)=>({c,x:tot(l.filter(e=>e.c==c.id)),k:c.col||PAL[i%12]})).filter(z=>z.x>0).sort((p,q)=>q.x-p.x),T=by.reduce((p,z)=>p+z.x,0),C=2*Math.PI*38;let o=0;if(!T)return'<div class="m">Nothing yet</div>';return`<svg viewBox="0 0 100 100" width="84" height="84" style="display:block;margin:0 auto 6px"><circle r="38" cx="50" cy="50" fill="none" stroke="var(--pk2)" stroke-width="16"/>${by.map(z=>{const n=z.x/T*C,r=`<circle r="38" cx="50" cy="50" fill="none" stroke="${z.k}" stroke-width="16" stroke-dasharray="${n} ${C-n}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"/>`;o+=n;return r}).join('')}</svg>${by.slice(0,4).map(z=>`<div class="row sp" style="gap:3px;font-size:10px;margin:2px 0"><span>${z.c.e} <span style="color:${z.k}">●</span></span><b style="flex:0">${Math.round(z.x/T*100)}%</b></div>`).join('')}`}
function home(){const s=S.set,nm=s.name||(ACC.name||'').split(' ')[0],k=P[s.g]||P.f,x=tot(S.entries),l=Math.floor(x/300)+1,p=x%300,td=S.entries.filter(e=>e.d==ymd()),h=new Date().getHours(),gr=h<5||h>=21?'Good Night':h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening',q=S.quotes[qi%S.quotes.length]||'',T=[['Today',tot(td)],['Level',l],['Activities',td.length],['Streak',streak()]],tm=S.days[ymd()],gl=S.goals.slice(0,3).map(g=>{const v=Math.min(100,Math.round(tot(S.entries.filter(e=>g.cs.includes(e.c)))/g.t*100));return`<div style="margin:7px 0"><div class="row sp" style="font-size:10px"><span>${esc(g.n)}</span><b style="flex:0">${v}%</b></div><div class="bar" style="height:8px"><i style="width:${v}%"></i></div></div>`}).join('')||'<div class="m">No goals yet</div>';
return`<div class="hero"><div class="row" style="gap:10px"><div style="flex:none" onclick="sh=true;render()">${av(s.g,72)}</div><div><div class="lx" style="font-weight:700;font-size:18px">${gr}${nm?', '+esc(nm):''}! ${h<5||h>=21?'🌙':h<17?'☀️':'🌇'}</div><div class="m" style="margin:2px 0 6px">Level ${l} · ${x} XP</div><div class="bar"><i style="width:${p/3}%"></i></div></div></div><div class="row" style="margin-top:10px"><button class="p" style="margin:0;padding:10px;font-size:13px" onclick="tab='log';render()">Log your day</button><div style="flex:0">${plant}</div></div></div>
<div class="g4">${T.map((t,i)=>`<div class="t" style="background:linear-gradient(160deg,${ra(mix(k.t[i],'#ffffff',.5),.8)},${ra(k.t[i],.62)})"><b class="lx">${t[1]}</b><div class="m">${t[0]}</div></div>`).join('')}</div>
<div class="two"><div class="c"><h3 class="lx">Weekly XP</h3>${wk()}</div><div class="c"><h3 class="lx">Goals</h3>${gl}</div></div>
<div class="two eq"><div class="c"><h3 class="lx">Recent</h3>${S.entries.slice(-3).reverse().map(e=>`<div class="it" style="padding:5px 0;font-size:12px"><span>${cat(e.c).e} ${esc(e.t)}</span><b style="flex:0">+${e.x}</b></div>`).join('')||'<div class="m">Nothing yet</div>'}</div><div class="c"><h3 class="lx">Mood</h3><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px">${MO.map(e=>`<button class="mo ${tm==e?'on':''}" style="padding:2px;font-size:19px;box-shadow:none;background:none" onclick="S.days[ymd()]='${e}';save()">${e}</button>`).join('')}</div></div></div>
<div class="hero row" onclick="qi++;render()" style="gap:10px;padding:10px 12px;margin:0"><div style="flex:none">${star}</div><div style="font-weight:700;font-size:14px">«${esc(q)}»</div></div>`}
function sheet(){const em=ACC.email||'';return`<div class="ov" onclick="sh=false;render()"><div class="sheet" onclick="event.stopPropagation()"><div class="row" style="gap:12px;justify-content:flex-start"><div style="flex:none">${av(S.set.g,58)}</div><div><input value="${esc(S.set.name||'')}" placeholder="${esc(ACC.name||'اسمت')}" onchange="S.set.name=this.value.trim();save()" style="margin:0 0 4px">${em?`<div class="m">${esc(em)}</div><div class="m">وصل به ایمیل حساب Claude</div>`:`<input type="email" inputmode="email" value="${esc(S.set.email||'')}" placeholder="ایمیلت" onchange="S.set.email=this.value.trim();save()" style="margin:0">`}</div></div><div class="row" style="margin-top:8px"><button class="p" onclick="go('set')">ظاهر و رنگ‌ها 🎨</button><button class="p" onclick="go('cat')">دسته‌ها 🧺</button></div><button class="p" style="background:var(--pk2);color:var(--ink)" onclick="mailBk()">بک‌آپ به ایمیل 📧</button><details style="margin-top:12px"><summary>پناهگاهی از جنس لونا 🍋</summary><div style="margin-top:8px;line-height:1.9">${S.set.mis?esc(S.set.mis):`منوی من، پناهگاهی از جنس لونا. ما اینجا لیموناد درست می‌کنیم تا تو روزهای کلافه‌کننده حس خنکی بهمون بده. فضایی از جنس لونا: خلوص، وفاداری و غریزه‌ی پاک؛ انرژی زلال و بی‌توقعی که حال آدم رو بی‌دلیل خوب می‌کنه. اینجا پناهگاهه، جایی برای زمین گذاشتن بار حساب‌کتاب‌ها و یادآوری اینکه در تمام معادلات زندگی، اولویت با حال خوبه.`}</div></details></div></div>`}
