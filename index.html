<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>منوی من 🍋</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="منوی من"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#e8799f">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5f8;--card:#fff;--ink:#4a2b3a;--mute:#9a7686;--pk:#e8799f;--pk2:#fbdbe6;--line:#f3dbe4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241820;--card:#33232d;--ink:#fbe6ee;--mute:#c9a3b4;--pk2:#5a3345;--line:#4a3340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241820;--card:#33232d;--ink:#fbe6ee;--mute:#c9a3b4;--pk2:#5a3345;--line:#4a3340;color-scheme:dark}
html,body{height:auto}body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;padding-bottom:84px}
.w{max-width:620px;margin:auto;padding:14px}.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px}.m{color:var(--mute);font-size:12px}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-sizing:border-box}
input,select,textarea{width:100%;margin:3px 0}textarea{min-height:80px}
button{cursor:pointer}.p{background:var(--pk);color:#fff;border:0;width:100%;padding:10px;font-weight:600;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button{padding:5px 10px;font-size:13px}.on{background:var(--pk)!important;color:#fff!important;border-color:var(--pk)!important}
.bar{height:10px;background:var(--pk2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pk2),var(--pk));border-radius:9px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.sp{justify-content:space-between}
.it{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;font-size:11px;padding:4px}nav button.on{background:none!important;color:var(--pk)!important;font-weight:800}
details{font-size:13px;color:var(--mute)}.mo{font-size:22px;padding:2px 6px;border-radius:12px}
</style></head><body><div class="w" id="app"></div><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),ymd=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const back=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
const DEF={cats:[
{id:'t',n:'طعم و عطر',e:'🍰',subs:['شیرینی‌پزی','آشپزی','پخت نان']},
{id:'b',n:'وقت رسیدگیه…',e:'💆‍♀️',subs:['Fafa beauty','ماسک مو و صورت','اسپا']},
{id:'m',n:'تکون بده',e:'💃',subs:['رقص','باشگاه','شنا','پیاده‌روی']},
{id:'c',n:'the creative nook',e:'🎨',subs:['نقاشی','گیتار','خیاطی']},
{id:'g',n:'touch of green',e:'🌿',subs:['گل و گیاه']},
{id:'r',n:'beyond reality',e:'📖',subs:['رمان','داستان','مطالعه‌ی تاریخی']},
{id:'j',n:'ارتقای شغلی',e:'💊',subs:['فارمسی','صنعت','دوره و وبینار','مهارت‌آموزی']},
{id:'l',n:'bilingual life',e:'🌍',subs:['انگلیسی','دولینگو','یوتیوب','کتاب']},
{id:'o',n:'out and about',e:'☕',subs:['طبیعت','کافه','غذای جدید','پیاده‌روی دلی']},
{id:'v',n:'recharge',e:'🚗',subs:['سفر']},
{id:'p',n:'پاداش بی‌بهانه',e:'🎁',subs:['هدیه به خودم','محبت به خودم','محبت به دیگران']}],
entries:[],days:{},goals:[{id:'g1',n:'تسلط به زبان',t:3000,cs:['l']}],notes:[],set:{acc:'#e8799f',bg:'#fff5f8',p2:'#fbdbe6',ln:'#f3dbe4',mode:'auto',title:'منوی من 🍋',xb:'چیکا کردی با خودت وای... 💕',ph:'امروز چه کارایی کردی؟ خودمونی بگو…',mis:''},quotes:['راه حل خودتی!','اولویت همیشه با حال خوبه 🍋']};
const MO=['😍','🥰','😊','😌','😐','😔','😣'],PAL=['#e8799f','#f2a6c0','#c58be0','#8fb8f0','#7ed3b8','#f5c26b','#f59e7b','#b0a1f5','#ee8fb8','#9ad07a','#e58a8a','#78c6d9'];
let S=JSON.parse(JSON.stringify(DEF)),ref=null,ed=null,eg=null,en=null,ec=null,dc=null,tab='today',date=ymd(),rng='day',from=back(29),to=ymd(),ai='',curF='😊',qi=0,R={};
const cat=id=>S.cats.find(c=>c.id==id)||{id,n:'؟',e:'✨',subs:[]};
const tot=l=>l.reduce((a,e)=>a+(+e.x||0),0);
function save(){try{localStorage.setItem('menu',JSON.stringify(S))}catch(e){}if(ref)ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{});render()}
function init(){try{const l=localStorage.getItem('menu');if(l){S=Object.assign(S,JSON.parse(l));render()}}catch(e){}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}try{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}}
function span(){if(rng=='day')return[date,date];if(rng=='7')return[back(6),ymd()];if(rng=='30')return[back(29),ymd()];if(rng=='all')return['0000','9999'];return[from,to]}
function head(){const x=tot(S.entries),l=Math.floor(x/300)+1,p=x%300,q=S.quotes[qi%S.quotes.length]||'';
return`<div class="c"><div class="row sp"><b style="font-size:18px">${esc(S.set.title)}</b><span style="text-align:left"><b>Level ${l}</b><br><span class="m">${x} XP</span></span></div><div class="bar" style="margin:8px 0 4px"><i style="width:${p/3}%"></i></div><div class="m">${300-p} امتیاز تا لول بعدی 🌸</div><p onclick="qi++;render()" style="margin:10px 0 4px;text-align:center;font-weight:600">«${esc(q)}»</p>
<details><summary>پناهگاهی از جنس لونا</summary>${S.set.mis?esc(S.set.mis):`منوی من، پناهگاهی از جنس لونا. ما اینجا لیموناد درست می‌کنیم تا تو روزهای کلافه‌کننده حس خنکی بهمون بده. فضایی از جنس لونا: خلوص، وفاداری و غریزه‌ی پاک؛ انرژی زلال و بی‌توقعی که حال آدم رو بی‌دلیل خوب می‌کنه. اینجا پناهگاهه، جایی برای زمین گذاشتن بار حساب‌کتاب‌ها و یادآوری اینکه در تمام معادلات زندگی، اولویت با حال خوبه.`}</details></div>`}
function today(){const l=S.entries.filter(e=>e.d==date),c0=S.cats[0]?S.cats[0].id:'',E=S.entries.find(e=>e.id==ed)||{};
return`<div class="c">${dpick(date,'sd')}<div class="m" style="margin-top:6px">مود کلی این روز:</div><div class="chips">${MO.map(e=>`<button class="mo ${S.days[date]==e?'on':''}" onclick="S.days['${date}']='${e}';save()">${e}</button>`).join('')}</div></div>
<div class="c"><h3>روایت شبانه 🌙</h3><textarea id="nar" placeholder="${esc(S.set.ph)}">${esc((S.nar||{})[date]||'')}</textarea><button class="p" id="xb" onclick="svN()">${esc(S.set.xb)}</button><div class="m">اینجا می‌نویسی و نگهش می‌داری؛ کارهات رو پایین ثبت کن 🌷</div></div>
<div class="c"><h3>${E.id?'ویرایش ✏️':'اضافه کردن دستی'}</h3><select id="fc" onchange="subs()">${S.cats.map(c=>`<option value="${c.id}" ${c.id==E.c?'selected':''}>${c.e} ${esc(c.n)}</option>`).join('')}</select><input id="ft" list="dl" value="${esc(E.t||'')}" placeholder="چی کار کردی؟"><datalist id="dl">${cat(E.c||c0).subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
<div class="row"><input id="fm" type="number" inputmode="numeric" value="${E.m||''}" placeholder="چند دقیقه؟"><div class="m" style="text-align:center">امتیاز: <b id="xv">${E.x||60}</b></div></div><input id="fx" type="range" min="20" max="150" step="5" value="${E.x||60}" oninput="$('#xv').textContent=this.value"><div class="m">عمق کار + حسِ خوبی که داد + تداوم</div>
<div class="chips">${MO.map(e=>`<button class="mo ${curF==e?'on':''}" data-e="${e}" onclick="curF='${e}';document.querySelectorAll('.mo[data-e]').forEach(b=>b.classList.toggle('on',b.dataset.e=='${e}'))">${e}</button>`).join('')}</div><button class="p" onclick="addE()">${E.id?'ذخیره‌ی تغییر':'ثبتش کن'} 🌷</button>${E.id?'<button class="p" style="background:var(--pk2);color:var(--ink)" onclick="ed=null;render()">بیخیال</button>':''}</div>
<div class="c"><h3>ثبت‌های ${fa(date)} · ${tot(l)} XP</h3>${l.length?l.map(e=>`<div class="it"><span>${e.f||''} ${cat(e.c).e} ${esc(e.t)}<br><span class="m">${e.m?e.m+' دقیقه · ':''}${esc(cat(e.c).n)}</span></span><span>+${e.x} <button onclick="ed='${e.id}';curF='${e.f||'😊'}';render();scrollTo(0,0)" style="border:0;background:none">✏️</button><button onclick="S.entries=S.entries.filter(z=>z.id!='${e.id}');save()" style="border:0;background:none">✕</button></span></div>`).join(''):'<div class="m">هنوز چیزی ثبت نشده؛ هر وقت دلت خواست 🌸</div>'}</div>`}
function subs(){$('#dl').innerHTML=cat($('#fc').value).subs.map(s=>`<option value="${esc(s)}">`).join('')}
function addE(){const t=$('#ft').value.trim();if(!t)return;const o={c:$('#fc').value,t,m:+$('#fm').value||0,f:curF,x:+$('#fx').value},E=S.entries.find(e=>e.id==ed);if(E)Object.assign(E,o);else S.entries.push({id:uid(),d:date,...o});ed=null;save()}
function svN(){S.nar=S.nar||{};S.nar[date]=$('#nar').value;save()}
function report(){const[a,b]=span(),l=S.entries.filter(e=>e.d>=a&&e.d<=b),by=S.cats.map((c,i)=>({c,i,k:c.col||PAL[i%12],x:tot(l.filter(e=>e.c==c.id)),m:l.filter(e=>e.c==c.id).reduce((s,e)=>s+(+e.m||0),0)})),T=tot(l),act=by.filter(z=>z.x>0).sort((p,q)=>q.x-p.x),C=2*Math.PI*40;let acc=0;
const pie=act.map(z=>{const len=z.x/T*C,s=`<circle r="40" cx="50" cy="50" fill="none" stroke="${z.k}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 50 50)"/>`;acc+=len;return s}).join('');
const mx=Math.max(1,...by.map(z=>z.x)),bw=300/by.length,bars=by.map((z,k)=>{const h=z.x/mx*100;return`<rect x="${k*bw+4}" y="${120-h}" width="${bw-8}" height="${h}" rx="5" fill="${z.k}"/><text x="${k*bw+bw/2}" y="${114-h}" font-size="9" text-anchor="middle" fill="currentColor">${z.x||''}</text><text x="${k*bw+bw/2}" y="138" font-size="13" text-anchor="middle">${z.c.e}</text>`}).join('');
const mood={};l.forEach(e=>{if(e.f)mood[e.f]=(mood[e.f]||0)+1});Object.entries(S.days).forEach(([d,e])=>{if(d>=a&&d<=b)mood[e]=(mood[e]||0)+1});
const strong=act.slice(0,2).map(z=>z.c.e+' '+z.c.n),calm=rng=='day'?[]:by.filter(z=>!z.x).map(z=>z.c.e+' '+z.c.n);
const goals=S.goals.map(g=>{const x=tot(S.entries.filter(e=>g.cs.includes(e.c)));return{g,x,p:Math.min(100,Math.round(x/g.t*100))}});
R.txt=`گزارش ${rng=='day'?fa(a):rng=='all'?'از اول تا الان':fa(a)+' تا '+fa(b)}\nمجموع: ${T} XP در ${l.length} فعالیت\n`+by.filter(z=>z.x).map(z=>`${z.c.n}: ${z.x} XP، ${z.m} دقیقه`).join('\n')+`\nمودها: ${Object.entries(mood).map(([e,n])=>e+'×'+n).join(' ')}\nهدف‌ها: `+goals.map(o=>`${o.g.n} ${o.p}%`).join('، ');
const chip=(k,t)=>`<button class="${rng==k?'on':''}" onclick="rng='${k}';render()">${t}</button>`;
return`<div class="c"><div class="chips">${chip('day','یک روز')}${chip('7','۷ روز اخیر')}${chip('30','ماه گذشته')}${chip('all','از اول تا الان')}${chip('x','بازه‌ی دلخواه')}</div>
${rng=='day'?`${dpick(date,'sd')}`:rng=='x'?`<div class="m">از</div>${dpick(from,'sfrom')}<div class="m">تا</div>${dpick(to,'sto')}`:''}</div>
<div class="c"><h3>${T} XP · ${l.length} فعالیت</h3>${T?`<svg viewBox="0 0 100 100" style="width:170px;display:block;margin:auto"><circle r="40" cx="50" cy="50" fill="none" stroke="var(--pk2)" stroke-width="18"/>${pie}<text x="50" y="54" font-size="13" text-anchor="middle" fill="currentColor">${T}</text></svg><div class="chips">${act.map(z=>`<span class="m"><span style="color:${z.k}">●</span> ${z.c.e} ${Math.round(z.x/T*100)}%</span>`).join('')}</div>
<svg viewBox="0 0 300 145" style="width:100%;margin-top:8px">${bars}</svg>${act.map(z=>`<div class="it"><span>${z.c.e} ${esc(z.c.n)}</span><span class="m">${z.m} دقیقه · ${z.x} XP</span></div>`).join('')}`:'<div class="m">برای این بازه چیزی ثبت نشده 🌸</div>'}</div>
<div class="c"><h3>حال‌وهوا</h3><div style="font-size:20px">${Object.entries(mood).map(([e,n])=>e+'<span class="m">×'+n+'</span> ').join('')||'<span class="m">—</span>'}</div></div>
<div class="c"><h3>داشبورد</h3>${strong.length?`<div>💪 پررنگ‌ترین: ${esc(strong.join('، '))}</div>`:''}${calm.length&&T?`<div class="m" style="margin-top:6px">🌱 این‌ها منتظرِ یه نوازشِ کوچیکن (بدون هیچ اجباری): ${esc(calm.join('، '))}</div>`:''}</div>
<div class="c"><h3>هدف‌ها 🎯</h3>${goals.map(o=>`<div style="margin:8px 0"><div class="row sp"><span>${esc(o.g.n)}</span><span class="m" style="text-align:left">${o.p}% · ${o.x}/${o.g.t}</span></div><div class="bar"><i style="width:${o.p}%"></i></div></div>`).join('')||'<div class="m">هنوز هدفی نذاشتی</div>'}</div>
<div class="c"><button class="p" onclick="cp()">کپی گزارش برای Claude 💗</button><p id="ao" style="white-space:pre-wrap;font-size:14px">${esc(ai)}</p><details><summary>متن گزارش (برای کپی)</summary><textarea readonly onclick="this.select()">${esc(R.txt)}</textarea></details></div>`}
async function cp(){const o=$('#ao');try{await navigator.clipboard.writeText(R.txt);o.textContent='کپی شد؛ توی چت Claude پیست کن تا آفرین بگه 💗'}catch(e){o.textContent='کپی نشد؛ از «متن گزارش» پایین دستی کپی کن 🌸'}}
function goal(){const G=S.goals.find(g=>g.id==eg)||{cs:[]};return`<div class="c"><h3>${G.id?'ویرایش هدف ✏️':'هدف جدید'}</h3><input id="gn" value="${esc(G.n||'')}" placeholder="مثلاً تسلط به زبان انگلیسی"><input id="gt" value="${G.t||''}" type="number" inputmode="numeric" placeholder="هدف چند XP؟ (مثلاً ۳۰۰۰)"><div class="m">کدوم دسته‌ها به این هدف کمک می‌کنن؟</div><div class="chips">${S.cats.map(c=>`<label class="m"><input type="checkbox" class="gc" value="${c.id}" ${G.cs.includes(c.id)?'checked':''} style="width:auto"> ${c.e} ${esc(c.n)}</label>`).join('')}</div><button class="p" onclick="addG()">${G.id?'ذخیره':'اضافه کن'} 🎯</button>${G.id?'<button class="p" style="background:var(--pk2);color:var(--ink)" onclick="eg=null;render()">بیخیال</button>':''}</div>`+S.goals.map(g=>`<div class="c row sp"><span>${esc(g.n)}<br><span class="m">${g.t} XP · ${g.cs.map(i=>cat(i).e).join(' ')}</span></span><button style="flex:0" onclick="eg='${g.id}';render();scrollTo(0,0)">✏️</button><button style="flex:0" onclick="S.goals=S.goals.filter(z=>z.id!='${g.id}');save()">✕</button></div>`).join('')}
function addG(){const n=$('#gn').value.trim(),t=+$('#gt').value;if(!n||!t)return;const o={n,t,cs:[...document.querySelectorAll('.gc:checked')].map(i=>i.value)},G=S.goals.find(g=>g.id==eg);if(G)Object.assign(G,o);else S.goals.push({id:uid(),...o});eg=null;save()}
function note(){return`<div class="c"><h3>دلنوشته 💌</h3><textarea id="nt" placeholder="اگه دلت گرفته، اینجا زمین بذارش…">${esc((S.notes.find(n=>n.id==en)||{}).tx||'')}</textarea><button class="p" onclick="addN()">${en?'ذخیره‌ی تغییر':'نگهش دار'}</button></div><div class="c"><h3>جمله‌های قشنگ ✨</h3><input id="qt" placeholder="یه جمله‌ی دوست‌داشتنی…"><button class="p" onclick="addQ()">اضافه کن</button><div class="m" style="margin-top:8px">${S.quotes.map((q,i)=>`<span class="m">${esc(q)} <a onclick="S.quotes.splice(${i},1);save()">✕</a></span>`).join(' · ')}</div></div>`+S.notes.slice().reverse().map(n=>`<div class="c"><div class="m row sp"><span>${fa(n.d)}</span><span style="flex:0;white-space:nowrap"><button onclick="en='${n.id}';render();scrollTo(0,0)" style="border:0;background:none">✏️</button><button onclick="S.notes=S.notes.filter(z=>z.id!='${n.id}');save()" style="border:0;background:none">✕</button></span></div><div style="white-space:pre-wrap">${esc(n.tx)}</div></div>`).join('')}
function addN(){const tx=$('#nt').value.trim();if(!tx)return;const N=S.notes.find(n=>n.id==en);if(N)N.tx=tx;else S.notes.push({id:uid(),d:ymd(),tx});en=null;save()}
function addQ(){const q=$('#qt').value.trim();if(!q)return;S.quotes.push(q);save()}
function cats(){return`<div class="c"><h3>دسته‌ی جدید</h3><div class="row"><input id="ce" placeholder="🌸" style="flex:0 0 60px"><input id="cn" placeholder="اسم دسته"></div><input id="cs" placeholder="زیردسته‌ها، با ویرگول جدا کن"><button class="p" onclick="addC()">اضافه کن 🌷</button></div>`+S.cats.map(c=>`<div class="c"><b>${c.e} ${esc(c.n)}</b><div class="m">${c.subs.map(esc).join(' · ')}</div></div>`).join('')}
function addC(){const n=$('#cn').value.trim();if(!n)return;S.cats.push({id:uid(),n,e:$('#ce').value.trim()||'✨',subs:$('#cs').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean)});save()}
const TH=[['صورتی ملیح','#e8799f','#fff5f8','#fbdbe6','#f3dbe4'],['یاسی','#a98be0','#f7f3ff','#e6dcfb','#e5dcf5'],['نعنایی','#4fb99a','#f1fbf7','#d3f1e6','#d5ede3'],['هلویی','#f29a6b','#fff6f0','#fde0cf','#f6e0d3'],['آسمانی','#6aa6e8','#f2f8ff','#d6e8fb','#d8e5f4']];
function applyT(){S.set=Object.assign({},DEF.set,S.set||{});const s=S.set,r=document.documentElement,st=r.style,dk=s.mode=='dark'||(s.mode!='light'&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dk?'dark':'light';['--bg','--pk2','--line'].forEach(k=>st.removeProperty(k));st.setProperty('--pk',s.acc);if(!dk){st.setProperty('--bg',s.bg);st.setProperty('--pk2',s.p2);st.setProperty('--line',s.ln)}}
function sett(){const s=S.set,bt='style="background:var(--pk2);color:var(--ink)"';return`<div class="c"><h3>رنگ و طرح 🎨</h3><div class="chips">${TH.map(t=>`<button style="border-color:${t[1]}" onclick="S.set.acc='${t[1]}';S.set.bg='${t[2]}';S.set.p2='${t[3]}';S.set.ln='${t[4]}';save()">${t[0]}</button>`).join('')}</div><div class="row"><label class="m">رنگ اصلی<input type="color" value="${s.acc}" onchange="S.set.acc=this.value;save()" style="padding:2px"></label><label class="m">رنگ زمینه<input type="color" value="${s.bg}" onchange="S.set.bg=this.value;save()" style="padding:2px"></label></div><div class="chips">${[['auto','خودکار'],['light','روشن'],['dark','تیره']].map(m=>`<button class="${s.mode==m[0]?'on':''}" onclick="S.set.mode='${m[0]}';save()">${m[1]}</button>`).join('')}</div><div class="m">رنگ هر دسته رو از تب «دسته‌ها» عوض کن.</div></div><div class="c"><h3>متن‌های اپ ✏️</h3><div class="m">اسم اپ</div><input value="${esc(s.title)}" onchange="S.set.title=this.value;save()"><div class="m">متن دکمه‌ی روایت</div><input value="${esc(s.xb)}" onchange="S.set.xb=this.value;save()"><div class="m">متن راهنمای کادر روایت</div><input value="${esc(s.ph)}" onchange="S.set.ph=this.value;save()"><div class="m">متن پناهگاه (خالی = متن اولیه)</div><textarea onchange="S.set.mis=this.value;save()">${esc(s.mis)}</textarea></div><div class="c"><h3>بک‌آپ 💾</h3><div class="m">یه نسخه از همه‌ی اطلاعاتت رو توی گوشی نگه دار؛ بازیابی، اطلاعات فعلی رو با فایل جایگزین می‌کنه.</div><button class="p" onclick="bk()">دانلود بک‌آپ</button><label class="m">بازیابی از فایل بک‌آپ<input type="file" onchange="rs(this.files[0])"></label><div id="bko" class="m"></div></div>`}
function cats(){const C=S.cats.find(c=>c.id==ec)||{subs:[]};return`<div class="c"><h3>${C.id?'ویرایش دسته ✏️':'دسته‌ی جدید'}</h3><div class="row"><input id="ce" value="${esc(C.e||'')}" placeholder="🌸" style="flex:0 0 60px"><input id="cn" value="${esc(C.n||'')}" placeholder="اسم دسته"><input id="ck" type="color" value="${C.col||PAL[(C.id?S.cats.indexOf(C):S.cats.length)%12]}" style="flex:0 0 52px;padding:2px"></div><input id="cs" value="${esc(C.subs.join('، '))}" placeholder="زیردسته‌ها، با ویرگول جدا کن"><button class="p" onclick="addC()">${C.id?'ذخیره':'اضافه کن'} 🌷</button>${C.id?'<button class="p" style="background:var(--pk2);color:var(--ink)" onclick="ec=null;render()">بیخیال</button>':''}</div>`+S.cats.map((c,i)=>`<div class="c row sp"><span><b style="color:${c.col||PAL[i%12]}">●</b> <b>${c.e} ${esc(c.n)}</b><br><span class="m">${c.subs.map(esc).join(' · ')}</span></span><span style="flex:0;white-space:nowrap"><button onclick="ec='${c.id}';render();scrollTo(0,0)" style="border:0;background:none">✏️</button><button onclick="delC('${c.id}')" style="border:0;background:none">${dc==c.id?'مطمئنی؟':'🗑'}</button></span></div>`).join('')+(dc?'<div class="m">با حذف یک دسته، ثبت‌های همون دسته هم پاک می‌شن؛ برای تأیید دوباره بزن.</div>':'')}
function delC(id){if(dc!=id){dc=id;render();return}S.cats=S.cats.filter(c=>c.id!=id);S.entries=S.entries.filter(e=>e.c!=id);S.goals.forEach(g=>g.cs=g.cs.filter(i=>i!=id));dc=null;save()}
function addC(){const n=$('#cn').value.trim();if(!n)return;const o={n,e:$('#ce').value.trim()||'✨',col:$('#ck').value,subs:$('#cs').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean)},C=S.cats.find(c=>c.id==ec);if(C)Object.assign(C,o);else S.cats.push({id:uid(),...o});ec=null;save()}
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],pd=n=>String(n).replace(/\d/g,x=>'۰۱۲۳۴۵۶۷۸۹'[x]);
function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;const gy2=gm>2?gy+1:gy;let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){let gy=jy>979?1600:621;if(jy>979)jy-=979;let days=365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);gy+=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const sal=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
const fa=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-').map(Number),j=g2j(y,m,d);return pd(j[2])+' '+JM[j[1]-1]+' '+pd(j[0])};
function dpick(iso,fn){const[y,m,d]=iso.split('-').map(Number),j=g2j(y,m,d),t=g2j(...ymd().split('-').map(Number))[0],y0=Math.min(t-5,j[0]),y1=Math.max(t+2,j[0]);let ys='';for(let k=y0;k<=y1;k++)ys+=`<option value="${k}" ${k==j[0]?'selected':''}>${pd(k)}</option>`;const sl=h=>`<select onchange="${fn}(jd(this))">${h}</select>`;return`<div class="row">${sl(Array.from({length:31},(_,i)=>`<option value="${i+1}" ${i+1==j[2]?'selected':''}>${pd(i+1)}</option>`).join(''))}${sl(JM.map((n,i)=>`<option value="${i+1}" ${i+1==j[1]?'selected':''}>${n}</option>`).join(''))}${sl(ys)}</div>`}
function jd(el){let[d,m,y]=[...el.parentNode.querySelectorAll('select')].map(x=>+x.value);for(;d>28;d--){const b=g2j(...j2g(y,m,d));if(b[1]==m&&b[2]==d)break}const g=j2g(y,m,d);return g[0]+'-'+String(g[1]).padStart(2,'0')+'-'+String(g[2]).padStart(2,'0')}
function bk(){const o=$('#bko'),t=JSON.stringify(S);try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='my-menu-backup-'+ymd()+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}o.innerHTML='بک‌آپ آماده شد 💗<details><summary>اگه دانلود نشد</summary><textarea readonly onclick="this.select()">'+esc(t)+'</textarea></details>'}
function rs(f){const o=$('#bko');if(!f)return;f.text().then(t=>{const j=JSON.parse(t);if(!Array.isArray(j.entries)||!Array.isArray(j.cats))throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEF)),j);save()}).catch(()=>{o.textContent='این فایل بک‌آپ درستی نبود 🌸'})}
function sd(v){date=v;render()}function sfrom(v){from=v;render()}function sto(v){to=v;render()}
const TABS=[['today','🌸','امروز'],['rep','📊','گزارش'],['goal','🎯','هدف‌ها'],['note','💌','دلنوشته'],['cat','🧺','دسته‌ها'],['set','🎨','ظاهر']];
